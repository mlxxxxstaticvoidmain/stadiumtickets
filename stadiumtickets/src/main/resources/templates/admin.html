<!DOCTYPE html>
<html xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Админ панель</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }
        .menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }
        .menu a {
            display: block;
            padding: 25px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .menu a:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .status {
            text-align: center;
            color: #666;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2196f3;
            text-decoration: none;
            text-align: center;
            width: 100%;
            font-weight: bold;
        }
        .menu-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Админ панель Stadium Tickets</h1>
        <div class="subtitle">Управление данными сайта</div>
        
    <div class="menu">
        <a href="/admin/accounts" sec:authorize="hasAuthority('Администратор')">
            <div class="menu-icon">👤</div>
            Аккаунты
        </a>
        <a href="/admin/user-roles" sec:authorize="hasAuthority('Администратор')">
            <div class="menu-icon">🔐</div>
            Назначение ролей
        </a>
        <a href="/admin/banks" sec:authorize="hasAuthority('Администратор')">
            <div class="menu-icon">🏦</div>
            Банки
        </a>
        <a href="/admin/venues">
            <div class="menu-icon">🏟️</div>
            Площадки
        </a>
        <a href="/admin/sectors">
            <div class="menu-icon">🗺️</div>
            Сектора
        </a>
        <a href="/admin/seats">
            <div class="menu-icon">💺</div>
            Места
        </a>
        <a href="/admin/events">
            <div class="menu-icon">📅</div>
            Мероприятия
        </a>
        <a href="/admin/gametypes" sec:authorize="hasAuthority('Администратор')">
            <div class="menu-icon">🎮</div>
            Типы игр
        </a>
        <a href="/admin/tickets">
            <div class="menu-icon">🎫</div>
            Билеты
        </a>
        <a href="/admin/orders">
            <div class="menu-icon">📦</div>
            Заказы
        </a>
        <a href="/admin/employees" sec:authorize="hasAuthority('Администратор')">
            <div class="menu-icon">👨‍💼</div>
            Сотрудники
        </a>
        <a href="/admin/cart" sec:authorize="hasAuthority('Администратор')">
            <div class="menu-icon">🛒</div>
            Корзина
        </a>
    </div>
        <div style="text-align: center;">
            <a href="/" class="back-link">← Вернуться на сайт</a>
        </div>
    </div>
</body>
</html>
