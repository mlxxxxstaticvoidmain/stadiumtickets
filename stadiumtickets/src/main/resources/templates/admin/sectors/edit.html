<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать сектор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .content { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .info-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            color: #666;
        }
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
        }
        .btn-secondary {
            background: #666;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Редактирование сектора</h1>
            <p>Измените информацию о секторе</p>
        </div>
        <div class="content">
            <div class="info-box">
                <strong>ID сектора:</strong> <span th:text="${sector.id}"></span>
            </div>
            
            <form action="/admin/sectors/edit" method="post">
                <input type="hidden" name="id" th:value="${sector.id}">
                
                <div class="form-group">
                    <label for="venueId">Площадка *</label>
                    <select id="venueId" name="venueId" required>
                        <option th:each="venue : ${venues}" 
                                th:value="${venue.id}" 
                                th:text="${venue.nameVenue}"
                                th:selected="${sector.venue != null && venue.id == sector.venue.id}"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="sectorName">Название сектора *</label>
                    <input type="text" id="sectorName" name="sectorName" th:value="${sector.sectorName}" required>
                </div>
                
                <div class="form-group">
                    <label for="zone">Зона *</label>
                    <input type="text" id="zone" name="zone" th:value="${sector.zone}" required>
                </div>
                
                <div class="buttons">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/admin/sectors" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
