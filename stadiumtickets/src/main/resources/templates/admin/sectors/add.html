<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить сектор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .content { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #9C27B0;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(45deg, #9C27B0, #7B1FA2);
            color: white;
        }
        .btn-secondary {
            background: #666;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Добавление сектора</h1>
            <p>Заполните информацию о секторе</p>
        </div>
        <div class="content">
            <form action="/admin/sectors/add" method="post">
                <div class="form-group">
                    <label for="venueId">Площадка *</label>
                    <select id="venueId" name="venueId" required>
                        <option th:each="venue : ${venues}" th:value="${venue.id}" th:text="${venue.nameVenue}"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="sectorName">Название сектора *</label>
                    <input type="text" id="sectorName" name="sectorName" required>
                </div>
                
                <div class="form-group">
                    <label for="zone">Зона *</label>
                    <input type="text" id="zone" name="zone" placeholder="Например: Центральная, VIP, Трибуна" required>
                </div>
                
                <div class="buttons">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/admin/sectors" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
