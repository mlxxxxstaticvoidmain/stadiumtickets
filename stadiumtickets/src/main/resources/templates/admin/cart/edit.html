<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать корзину</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .content { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .info-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            color: #666;
        }
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
        }
        .btn-secondary {
            background: #666;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Редактирование записи корзины</h1>
            <p>Измените информацию</p>
        </div>
        <div class="content">
            <div class="info-box">
                <strong>ID записи:</strong> <span th:text="${cart.id}"></span>
                <br>
                <strong>Дата добавления:</strong> <span th:text="${#temporals.format(cart.addedAt, 'dd.MM.yyyy HH:mm')}"></span>
            </div>
            
            <form action="/admin/cart/edit" method="post">
                <input type="hidden" name="id" th:value="${cart.id}">
                
                <div class="form-group">
                    <label for="accountId">Пользователь *</label>
                    <select id="accountId" name="accountId" required>
                        <option th:each="account : ${accounts}" 
                                th:value="${account.id}" 
                                th:text="${account.firstName} + ' ' + ${account.lastName} + ' (' + ${account.username} + ')'"
                                th:selected="${account.id == (cart.account != null ? cart.account.getId() : -1)}"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="ticketId">Билет *</label>
                    <select id="ticketId" name="ticketId" required>
                        <option th:each="ticket : ${tickets}" 
                                th:value="${ticket.id}" 
                                th:text="'Билет #' + ${ticket.id} + ' - ' + ${ticket.price} + ' ₽ (' + 
                                        (${ticket.status == 'available'} ? 'Доступен' : 
                                         (${ticket.status == 'sold'} ? 'ПРОДАН' : 'В КОРЗИНЕ')) + ')'"
                                th:disabled="${ticket.status != 'available' and ticket.id != (cart.ticket != null ? cart.ticket.getId() : -1)}"
                                th:selected="${ticket.id == (cart.ticket != null ? cart.ticket.getId() : -1)}"></option>
                    </select>
                </div>

                
                <div class="buttons">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/admin/cart" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
