<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить в корзину</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #FFC107 0%, #FFA000 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .content { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(45deg, #FFC107, #FFA000);
            color: white;
        }
        .btn-secondary {
            background: #666;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Добавление в корзину</h1>
            <p>Выберите пользователя и билет</p>
        </div>
        <div class="content">
            <form action="/admin/cart/add" method="post">
                <div class="form-group">
                    <label for="accountId">Пользователь *</label>
                    <select id="accountId" name="accountId" required>
                        <option th:each="account : ${accounts}" th:value="${account.id}" th:text="${account.firstName} + ' ' + ${account.lastName} + ' (' + ${account.username} + ')'"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="ticketId">Билет *</label>
                    <select id="ticketId" name="ticketId" required>
                        <option th:each="ticket : ${tickets}" th:value="${ticket.id}" th:text="'Билет #' + ${ticket.id} + ' - ' + ${ticket.price} + ' ₽'"></option>
                    </select>
                </div>
                
                <div class="buttons">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/admin/cart" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
