<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список типов игр</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #009688 0%, #00796B 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 30px;
        }
        
        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2e7d32;
            animation: slideIn 0.3s ease-out;
        }
        
        .alert-error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c62828;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            text-decoration: none;
            border-radius: 5px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .btn-add {
            background: linear-gradient(45deg, #009688, #00796B);
        }
        
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 150, 136, 0.3);
        }
        
        .btn-edit {
            background: linear-gradient(45deg, #2196F3, #1976D2);
        }
        
        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(33, 150, 243, 0.3);
        }
        
        .btn-delete {
            background: linear-gradient(45deg, #f44336, #d32f2f);
        }
        
        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(244, 67, 54, 0.3);
        }
        
        .btn-back {
            background: #666;
        }
        
        .btn-back:hover {
            background: #555;
        }
        
        .btn-search {
            background: linear-gradient(45deg, #009688, #00796B);
        }
        
        .btn-reset {
            background: #9E9E9E;
        }
        
        .btn-page {
            background: #e0e0e0;
            color: #333;
            padding: 8px 12px;
        }
        
        .btn-page.active {
            background: #009688;
            color: white;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        
        th {
            background: linear-gradient(135deg, #009688, #00796B);
            color: white;
            font-weight: bold;
        }
        
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        tr:hover {
            background-color: #f5f5f5;
        }
        
        .actions {
            white-space: nowrap;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .search-section {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .search-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        
        .search-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .search-group input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
        }
        
        .search-group button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .info-text {
            text-align: center;
            color: #666;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Управление типами игр</h1>
            <p>Просмотр, добавление, редактирование и удаление типов игр</p>
        </div>
        
        <div class="content">
            <!-- Сообщения об успехе и ошибках -->
            <div th:if="${success}" class="alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert-error" th:text="${error}"></div>
            
            <div class="top-bar">
                <a href="/admin" class="btn btn-back">← Назад</a>
                <a href="/admin/gametypes/new" class="btn btn-add">Добавить тип игры</a>
            </div>

            <div class="search-section">
                <div class="search-title">Поиск типов игр</div>

                <form method="get" th:action="@{/admin/gametypes}" class="search-group">
                    <input type="number" name="id" placeholder="Поиск по ID..." th:value="${searchId}">
                    <input type="hidden" name="size" th:value="${size}">
                    <button type="submit" class="btn-search">Найти по ID</button>
                </form>

                <form method="get" th:action="@{/admin/gametypes}" class="search-group">
                    <input type="text" name="name" placeholder="Поиск по названию..." th:value="${searchName}">
                    <input type="hidden" name="size" th:value="${size}">
                    <button type="submit" class="btn-search">Найти по названию</button>
                    <a href="/admin/gametypes" class="btn-reset btn">Сбросить</a>
                </form>
            </div>

            <div th:if="${searchId != null}" class="info-text">Результаты поиска по ID: <strong th:text="${searchId}"></strong></div>
            <div th:if="${searchName != null and !searchName.isEmpty()}" class="info-text">Результаты поиска по названию: <strong th:text="${searchName}"></strong></div>
            
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название типа</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="gametype : ${gametypes}">
                        <td th:text="${gametype.id}">1</td>
                        <td th:text="${gametype.tournamentName}">Футбол</td>
                        <td class="actions">
                            <a th:href="@{/admin/gametypes/edit/{id}(id=${gametype.id})}" class="btn btn-edit">Изменить</a>
                            
                            <!-- POST форма для удаления -->
                            <form th:action="@{/admin/gametypes/delete/{id}(id=${gametype.id})}" 
                                  method="post" 
                                  style="display: inline;"
                                  onsubmit="return confirm('Удалить тип игры «' + '[[${gametype.tournamentName}]]' + '»? Если есть мероприятия с этим типом, удаление будет невозможно.');">
                                
                                <input type="hidden" name="page" th:value="${currentPage}">
                                <input type="hidden" name="size" th:value="${size}">
                                <input type="hidden" name="searchId" th:value="${searchId}">
                                <input type="hidden" name="searchName" th:value="${searchName}">
                                
                                <button type="submit" class="btn btn-delete">Удалить</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${gametypes.isEmpty()}">
                        <td colspan="3" style="text-align: center;">Нет данных</td>
                    </tr>
                </tbody>
            </table>
            
            <div class="pagination" th:if="${totalPages > 1}">
                <a th:href="@{/admin/gametypes(page=0, size=${size}, id=${searchId}, name=${searchName})}" class="btn btn-page">«</a>
                <a th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                   th:href="@{/admin/gametypes(page=${i}, size=${size}, id=${searchId}, name=${searchName})}"
                   th:text="${i+1}"
                   th:class="${i == currentPage} ? 'btn btn-page active' : 'btn btn-page'">
                </a>
                <a th:href="@{/admin/gametypes(page=${totalPages-1}, size=${size}, id=${searchId}, name=${searchName})}" class="btn btn-page">»</a>
            </div>
            
            <div class="info-text">
                Страница <span th:text="${currentPage + 1}">1</span> из <span th:text="${totalPages != null ? totalPages : 1}">1</span> | 
                Всего записей: <span th:text="${totalItems != null ? totalItems : gametypes.size()}">0</span>
            </div>
        </div>
    </div>
</body>
</html>
