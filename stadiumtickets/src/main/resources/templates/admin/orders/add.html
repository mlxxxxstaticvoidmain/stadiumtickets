<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить заказ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #FF5722 0%, #E64A19 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #FF5722;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #FF5722, #E64A19);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 87, 34, 0.3);
        }
        
        .btn-secondary {
            background: #666;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #555;
        }
        
        .price-hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Добавление заказа</h1>
            <p>Заполните информацию о заказе</p>
        </div>
        
        <div class="content">
            <form action="/admin/orders/add" method="post">
                <div class="form-group">
                    <label for="accountId">Пользователь *</label>
                    <select id="accountId" name="accountId" required>
                        <option th:each="account : ${accounts}" th:value="${account.id}" th:text="${account.firstName} + ' ' + ${account.lastName} + ' (' + ${account.username} + ')'"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="ticketId">Билет *</label>
                    <select id="ticketId" name="ticketId" required>
                        <option th:each="ticket : ${tickets}" 
                                th:value="${ticket.id}" 
                                th:data-price="${ticket.price}"
                                th:text="'Билет #' + ${ticket.id} + ' - ' + ${ticket.price} + ' ₽ (Доступен)'"></option>
                    </select>
                    <div th:if="${tickets.isEmpty()}" style="color: red; margin-top: 5px;">
                        Нет доступных билетов для оформления заказа
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="employeeId">ID продавца *</label>
                    <select id="employeeId" name="employeeId" required>
                        <option th:each="employee : ${employees}" th:value="${employee.id}" th:text="'ID: ' + ${employee.id}"></option>
                    </select>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="paymentMethod">Способ оплаты *</label>
                        <select id="paymentMethod" name="paymentMethod" required>
                            <option value="card">Карта</option>
                            <option value="cash">Наличные</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="totalAmount">Сумма (₽) *</label>
                        <input type="number" id="totalAmount" name="totalAmount" step="100" required>
                        <div class="price-hint">Цена выбранного билета: <span id="selectedPrice">0</span> ₽</div>
                    </div>
                </div>
                
                <div class="buttons">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/admin/orders" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        const ticketSelect = document.getElementById('ticketId');
        const totalAmountInput = document.getElementById('totalAmount');
        const selectedPriceSpan = document.getElementById('selectedPrice');
        
        function updatePrice() {
            const selectedOption = ticketSelect.options[ticketSelect.selectedIndex];
            const price = selectedOption.getAttribute('data-price');
            if (price) {
                totalAmountInput.value = price;
                selectedPriceSpan.textContent = price;
            }
        }
        
        ticketSelect.addEventListener('change', updatePrice);
        updatePrice(); 
    </script>
</body>
</html>
