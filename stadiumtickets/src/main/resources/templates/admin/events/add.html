<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить мероприятие</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #FF9800;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #FF9800, #F57C00);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
        }
        
        .btn-secondary {
            background: #666;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Добавление мероприятия</h1>
            <p>Заполните информацию о событии</p>
        </div>
        
        <div class="content">
            <form th:action="@{/admin/events/add}" th:object="${event}" method="post">
                <div class="form-group">
                    <label for="title">Название мероприятия *</label>
                    <input type="text" id="title" th:field="*{title}" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="venue">Площадка *</label>
                        <select id="venueId" name="venueId" required>
                            <option value="">Выберите площадку</option>
                            <option th:each="v : ${venues}" th:value="${v.id}" th:text="${v.nameVenue}"></option>
                        </select>
                    </div>
                    

                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="gametype">Тип турнира *</label>
                        <select id="gametypeId" name="gametypeId" required>
                            <option value="">Выберите тип турнира</option>
                            <option th:each="g : ${gametypes}" th:value="${g.id}" th:text="${g.tournamentName}"></option>
                        </select>
                    </div>
                                        

                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventDate">Дата проведения *</label>
                        <input type="date" id="eventDate" th:field="*{eventDate}" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="price">Цена (₽) *</label>
                        <input type="number" id="price" th:field="*{price}" step="100" required>
                    </div>
                </div>
                
                <div class="buttons">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/admin/events" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
