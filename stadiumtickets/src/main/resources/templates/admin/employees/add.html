<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить сотрудника</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #00BCD4;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #00BCD4, #0097A7);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 188, 212, 0.3);
        }
        
        .btn-secondary {
            background: #666;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Добавление сотрудника</h1>
            <p>Заполните информацию о сотруднике</p>
        </div>
        
        <div class="content">
            <form action="/admin/employees/add" method="post">
                <div class="form-group">
                    <label for="accountId">Аккаунт *</label>
                    <select id="accountId" name="accountId" required>
                        <option th:each="account : ${accounts}" th:value="${account.id}" th:text="${account.firstName} + ' ' + ${account.lastName} + ' (' + ${account.username} + ')'"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="bankId">Банк *</label>
                    <select id="bankId" name="bankId" required>
                        <option th:each="bank : ${banks}" th:value="${bank.id}" th:text="${bank.bankName}"></option>
                    </select>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="hireDate">Дата приема *</label>
                        <input type="date" id="hireDate" name="hireDate" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="salary">Зарплата (₽) *</label>
                        <input type="number" id="salary" name="salary" step="1000" required>
                    </div>
                </div>
                
                <div class="buttons">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/admin/employees" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
