<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить место</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #795548 0%, #5D4037 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .content { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #795548;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(45deg, #795548, #5D4037);
            color: white;
        }
        .btn-secondary {
            background: #666;
            color: white;
        }
        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Добавление места</h1>
            <p>Заполните информацию о месте</p>
        </div>
        <div class="content">
            <form action="/admin/seats/add" method="post">
                <div class="form-group">
                    <label for="sectorId">Сектор *</label>
                    <select id="sectorId" name="sectorId" required>
                        <option value="">Выберите сектор</option>
                        <option th:each="sector : ${sectors}" 
                                th:value="${sector.id}" 
                                th:text="${sector.sectorName} + ' (' + ${sector.venueName} + ')'">
                        </option>
                    </select>
                    <div class="info-text">Выберите сектор - площадка определится автоматически</div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="rowNumber">Ряд *</label>
                        <input type="number" id="rowNumber" name="rowNumber" min="1" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="seatNumber">Номер места *</label>
                        <input type="number" id="seatNumber" name="seatNumber" min="1" required>
                    </div>
                </div>
                
                <div class="buttons">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/admin/seats" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
