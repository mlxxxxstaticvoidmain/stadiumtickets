<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать площадку</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .content { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        .btn-primary { background: linear-gradient(45deg, #2196F3, #1976D2); color: white; }
        .btn-secondary { background: #666; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Редактирование площадки</h1>
            <p>Измените информацию о стадионе</p>
        </div>
        <div class="content">
            <form th:action="@{/admin/venues/edit}" th:object="${venue}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="form-group">
                    <label for="nameVenue">Название стадиона *</label>
                    <input type="text" id="nameVenue" th:field="*{nameVenue}" required>
                </div>
                <div class="form-group">
                    <label for="address">Адрес *</label>
                    <textarea id="address" th:field="*{address}" rows="3" required></textarea>
                </div>
                <div class="buttons">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/admin/venues" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
